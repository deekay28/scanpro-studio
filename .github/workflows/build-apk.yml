name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python libraries for Office output validation in tests
        run: python3 -m pip install python-docx openpyxl python-pptx

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.scanprostudio --project-name scanpro_studio .
          fi
          python3 tool/configure_android.py

      - name: Install dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev poppler-utils
          flutter pub get

      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: set -o pipefail; flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt

      - name: Unit & widget tests
        id: tests
        continue-on-error: true
        run: set -o pipefail; flutter test --reporter expanded 2>&1 | tee test-results.txt

      - name: Build release APK (universal)
        run: flutter build apk --release

      - name: Build release APKs (per ABI, smaller)
        run: flutter build apk --release --split-per-abi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ScanProStudio-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/ScanProStudio-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/ScanProStudio-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/ScanProStudio-x86_64.apk || true
          cp test-results.txt analyze.txt dist/ || true
          ls -la dist

      - name: Verify APK permissions
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions dist/ScanProStudio-universal.apk | tee dist/permissions.txt

      - uses: actions/upload-artifact@v4
        with:
          name: scanpro-studio-apk
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScanPro Studio 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Automated build from ${{ github.sha }}.

            **Install:** download `ScanProStudio-arm64-v8a.apk` (most phones from 2017 on) or the universal APK, open it on your Android phone and allow "Install unknown apps" for your browser/file manager when asked.

            Static analysis: ${{ steps.analyze.outcome }} · Tests: ${{ steps.tests.outcome }} (see test-results.txt).
            Signed with a debug key — for personal sideloading, not for the Play Store.
          files: |
            dist/*.apk
            dist/test-results.txt
            dist/analyze.txt
            dist/permissions.txt
