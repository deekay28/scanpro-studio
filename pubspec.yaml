name: scanpro_studio
description: "ScanPro Studio - offline document scanner, PDF toolkit, OCR and passport photo print studio."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: '>=2.5.1 <3.0.0'

  # Storage
  sqflite: '>=2.3.3 <3.0.0'
  path_provider: '>=2.1.4 <3.0.0'
  path: '>=1.9.0 <2.0.0'
  flutter_secure_storage: '>=9.2.2 <10.0.0'

  # Capture & import
  camera: '>=0.10.5 <0.12.0'
  image_picker: '>=1.1.2 <2.0.0'
  file_picker: '>=8.1.2 <9.0.0'
  google_mlkit_document_scanner: '>=0.3.0 <1.0.0'

  # On-device ML (all bundled models; no network needed)
  google_mlkit_text_recognition: '>=0.13.0 <1.0.0'
  google_mlkit_face_detection: '>=0.11.0 <1.0.0'
  google_mlkit_selfie_segmentation: '>=0.8.0 <1.0.0'
  google_mlkit_barcode_scanning: '>=0.12.0 <1.0.0'

  # Imaging & documents
  image: '>=4.2.0 <4.3.0'
  archive: '>=3.6.1 <4.0.0'
  syncfusion_flutter_pdf: '>=27.1.48 <40.0.0'
  printing: '>=5.12.0 <6.0.0'

  # Sharing, security, misc
  share_plus: '>=10.0.0 <11.0.0'
  local_auth: '>=2.3.0 <3.0.0'
  cryptography: '>=2.7.0 <3.0.0'
  qr_flutter: '>=4.1.0 <5.0.0'
  pdfium_dart: '>=0.2.5 <0.3.0'
  ffi: ^2.2.0
  xml: ^6.6.1
  html: ^0.15.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'
  sqflite_common_ffi: '>=2.3.0 <3.0.0'
  crypto: ^3.0.8

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/FreeSans.ttf

# Host-side tests (sqflite_common_ffi) use the system SQLite, which has FTS4
# like Android's. The default bundled build only ships FTS5.
hooks:
  user_defines:
    sqlite3:
      source: system
